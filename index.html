function chooseTile(map, key, x, y) {

function drawTile(context, img, tile, dx, dy) {

  if (!tile.rot) {

  const cr = W / H;
  let dw;
  let dh;
  if (ir > cr) { dh = H; dw = H * ir; } else { dw = W; dh = W / ir; }
  ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  ctx.imageSmoothingEnabled = false;
}

  const cut = state.cut;
  const appear = clamp(cut.t / 2.2, 0, 1);
  const ease = appear * appear * (3 - 2 * appear);
  ctx.save();
  ctx.translate(Math.sin(state.t * 40) * state.shake, 0);
  const img = images.head;
  if (img) {
    const width = 80 + ease * 460;
    const height = width * (img.height / img.width);
    const y = 390 - ease * 80 + Math.sin(state.t * 1.4) * 8;
    ctx.fillStyle = "rgba(0,0,0," + (0.35 * ease) + ")";
    ctx.beginPath();
    ctx.ellipse(760, 560, 150 * ease, 28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = ease;
    ctx.drawImage(img, 760 - width / 2, y - height / 2, width, height);
    ctx.globalAlpha = 1;
  }
  drawFx();
  ctx.restore();
  drawLetterbox(clamp(cut.t / 0.6, 0, 1));
  const caption = cut.t < 7
    ? (cut.t < 3.2
      ? "The mist climbs off the dais and tears itself open."
      : "A head rises out of it. No throat. No shoulders. A bald crown. A beard salted with gray. The smile is late. The eyes were already on you.")
    : "";
  if (caption) {
    panel(120, H - 168, W - 240, 92, true);
    ctx.font = "22px Georgia, serif";
    ctx.fillStyle = "#1c1a18";
    ctx.textAlign = "center";
    const lines = wrap(caption, W - 320);
    lines.forEach((line, i) => ctx.fillText(line, W / 2, H - 124 + i * 28));
  }
  if (cut.shout >= 0 && cut.t < 16.2) {
    const index = cut.shout;
    const local = cut.t - [7.1, 10.5, 13.7][index];
    if (local < 2.6) drawShout(SHOUTS[index], 1);
  }
}
function drawEnding() {
  cover(images.chamber);
  drawLetterbox(1);
  ctx.fillStyle = "rgba(4,8,12,0.35)";
  ctx.fillRect(0, 78, W, H - 156);
  panel(180, 180, 920, 340, true);
  ctx.textAlign = "center";
  ctx.fillStyle = "#1c1a18";
  ctx.font = "28px Georgia, serif";
  const lines = [
    "The head unravels into mist.",
    "The smile is the last thing to go.",
    "The Maw is only stone now.",
    "Bram's bead is in your pack.",
  ];
  lines.forEach((line, i) => ctx.fillText(line, W / 2, 260 + i * 48));
  ctx.font = "600 18px Segoe UI, sans-serif";
  ctx.fillStyle = "#6a1e1e";
  ctx.fillText("Enter", W / 2, 470);
}
function drawGameOver() {
  if (state.battle) drawBattleScene();
  ctx.fillStyle = "rgba(20,6,8,0.45)";
  ctx.fillRect(0, 0, W, H);
  panel(340, 250, 600, 220, false);
  ctx.textAlign = "center";
  ctx.fillStyle = "#2a2118";
  ctx.font = "700 36px Georgia, serif";
  ctx.fillText("You fall.", 640, 330);
  ctx.font = "22px Georgia, serif";
  ctx.fillText("The mist keeps the smile.", 640, 374);
  ctx.font = "600 18px Segoe UI, sans-serif";
  ctx.fillText("Enter  —  stand back up", 640, 424);
}
function render() {
  state.hits = [];
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;
  if (!state.ready) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#8fd0e8");
    g.addColorStop(0.55, "#49b7c8");
    g.addColorStop(1, "#1d8a62");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    drawTitle();
  } else if (state.mode === "cutscene") drawCutscene();
  else if (state.mode === "ending") drawEnding();
  else if (state.mode === "battle" || state.mode === "gameover") {
    drawBattleScene();
    if (state.mode === "battle") drawBattleUi();
    else drawGameOver();
  } else {
    drawWorld();
    drawHud();
    if (state.mode === "title") drawTitle();
    if (state.mode === "landing") {
      drawLetterbox(0.85);
      panel(160, H - 156, W - 320, 64, false);
      ctx.textAlign = "center";
      ctx.fillStyle = "#2a2118";
      ctx.font = "22px Georgia, serif";
      ctx.fillText("The sea gives you back to the sand.", W / 2, H - 116);
    }
    if (state.mode === "dialogue") drawDialogue();
    if (state.mode === "inventory") drawInventory();
    if (state.mode === "note") drawNote();
  }
  if (state.flash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + (state.flash * 0.7) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (state.transition) {
    const alpha = state.transition.phase === "out"
      ? clamp(state.transition.t / 0.28, 0, 1)
      : 1 - clamp(state.transition.t / 0.28, 0, 1);
    ctx.fillStyle = "rgba(4,8,12," + alpha + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

function clickAt(ev) {
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) * (W / rect.width);
  const y = (ev.clientY - rect.top) * (H / rect.height);
  if (state.mode === "title") { state.wantPlay = true; return; }
  if (state.mode === "dialogue") { advanceDialogue(); return; }
  if (state.mode === "note") { advanceNote(); return; }
  if (state.mode === "ending") { state.pressed.add("Enter"); return; }
  if (state.mode === "gameover") { retryBattle(); return; }
  if (state.mode === "battle" && state.battle && state.battle.phase === "menu") {
    const hitbox = state.hits.find((box) => x >= box.x && y >= box.y && x <= box.x + box.w && y <= box.y + box.h);
    if (hitbox) {
      const index = Number(hitbox.id.slice(4));
      state.battle.cursor = index;
      activateBattle();
    }
  }
}

async function boot() {
  const jobs = [];
  const add = (key, src) => jobs.push(loadImage(src).then((img) => { images[key] = img; }));
  add("coast", "assets/tiles/coast.png");
  add("meadow", "assets/tiles/meadow.png");
  add("dungeon", "assets/tiles/dungeon.png");
  for (const name of ["cottage", "gate", "tree", "palm", "rock", "flowers", "chest", "stone", "pillar", "roots"]) {
    const v = name === "gate" || name === "pillar" || name === "roots" ? "?v=3" : "";
    add(name, "assets/objects/" + name + ".png" + v);
  }
  for (const who of ["lark", "bram", "goblin"]) {
    for (const dir of DIRS) add(who + "-" + dir, "assets/" + who + "/" + dir + ".png");
  }
  for (const dir of DIRS) {
    add("tide-" + dir, "assets/lark/tide/" + dir + ".png");
    add("scale-" + dir, "assets/lark/scale/" + dir + ".png");
  }
  for (const dir of CARDINALS) {
    walk[dir] = new Array(8);
    gearWalk.tide[dir] = new Array(8);
    gearWalk.scale[dir] = new Array(8);
    for (let i = 0; i < 8; i++) {
      jobs.push(loadImage("assets/lark/walk/" + dir + "/" + i + ".png?v=3").then((img) => { walk[dir][i] = img; }));
      jobs.push(loadImage("assets/lark/walk-tide/" + dir + "/" + i + ".png?v=3").then((img) => { if (img) gearWalk.tide[dir][i] = img; }));
      jobs.push(loadImage("assets/lark/walk-mail/" + dir + "/" + i + ".png?v=3").then((img) => { if (img) gearWalk.scale[dir][i] = img; }));
    }
  }
  add("torch", "assets/objects/torch.png");
  add("sconce", "assets/objects/sconce.png?v=4");
  add("flame", "assets/objects/flame.png?v=4");
  add("floortex", "assets/tiles/dungeon-floor.png?v=3");
  add("walltex", "assets/tiles/dungeon-wall.png?v=3");
  add("larkIdle", "assets/battle/lark-idle.png");
  add("larkSlash", "assets/battle/lark-slash.png");
  add("goblinA", "assets/battle/goblin-a.png");
  add("goblinB", "assets/battle/goblin-b.png");
  add("portrait", "assets/battle/lark-portrait.jpg");
  add("hall", "assets/battle/battle-hall.jpg");
  add("chamber", "assets/battle/boss-chamber.jpg");
  add("head", "assets/boss-head.png");
  for (const id of ["saber", "knife", "coat", "hood", "copper", "bone", "twine", "bead", "tonic", "tideblade", "scalevest"]) {
    add("item-" + id, "assets/items/" + id + ".png");
  }
  for (const dir of DIRS) add("shaman-" + dir, "assets/shaman/" + dir + ".png");
  await Promise.all(jobs);
  island = buildIsland();
  dungeon = buildDungeon();
  state.ready = true;
  render();
}

window.addEventListener("keydown", (event) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) event.preventDefault();
  state.held.add(event.code);
  if (!event.repeat) state.pressed.add(event.code);
  audio();
});
window.addEventListener("keyup", (event) => state.held.delete(event.code));
window.addEventListener("blur", () => { state.held.clear(); });
canvas.addEventListener("pointerdown", clickAt);

function frame(now) {
  if (rafOn) {
    const dt = Math.min(0.05, lastTs ? (now - lastTs) / 1000 : 0.016);
    lastTs = now;
    update(dt);
    render();
  }
  requestAnimationFrame(frame);
}
window.advanceTime = (ms) => {
  rafOn = false;
  const steps = Math.max(1, Math.round(ms / (1000 / 60)));
  for (let i = 0; i < steps; i++) update(1 / 60);
  render();
};
window.render_game_to_text = () => {
  const stats = derived();
  const battle = state.battle;
  const payload = {
    coord: "tile units, origin top-left of the current map, +x east, +y south",
    mode: state.mode,
    map: state.map,
    quest: state.quest,
    objective: objective(),
    noteRead: state.noteRead,
    goblinsDone: state.goblinsDone,
    bossDone: state.bossDone,
    prompt: state.prompt ? state.prompt.label : null,
    player: {
      x: Math.round(state.player.x * 100) / 100,
      y: Math.round(state.player.y * 100) / 100,
      facing: state.player.facing,
      hp: state.player.hp,
      mp: state.player.mp,
      maxHp: stats.maxHp,
      maxMp: stats.maxMp,
      atk: stats.atk,
      def: stats.def,
    },
    equip: state.equip,
    bag: state.bag.slice(),
    tonics: state.tonics,
    dialogue: state.dialogue ? { speaker: state.dialogue.lines[state.dialogue.i].speaker, text: state.dialogue.lines[state.dialogue.i].text } : null,
    notePage: state.mode === "note" ? state.notePage : null,
    bram: island ? island.bram : null,
    gate: island ? (island.props.find((prop) => prop.kind === "gate") || null) : null,
    battle: battle ? {
      kind: battle.kind,
      phase: battle.phase,
      menu: battle.menu,
      cursor: battle.cursor,
      log: battle.log,
      enemies: battle.enemies.map((enemy) => ({ name: enemy.name, hp: enemy.hp, max: enemy.max })),
    } : null,
  };
  return JSON.stringify(payload);
};
requestAnimationFrame(frame);
boot();
</script>
